<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trip Hub</title>
  <meta name="description" content="Shared trip planner: dates, tickets, stays, routes and photos in one place, synced to everyone's calendar.">
  <meta name="theme-color" content="#2e3e32" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141b16" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Trip Hub">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" aria-live="polite"><p class="loading">Loading…</p></main>
  <div id="toast" role="status"></div>
  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
